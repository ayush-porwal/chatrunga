name: e2e

# Electron smoke journeys (apps/desktop/e2e): launch the real app and drive it — boot, PGN import,
# persistence across a restart, positions, puzzles (scan worker), offline analysis — on Linux and
# Windows, from out/ and as the packaged app. Too slow and windowed for every PR: nightly, on
# demand, and (release.yml) against every packaged release build.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke journeys (${{ matrix.name }}, built and packaged)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Each OS reports on its own: a Linux failure doesn't hide whether Windows passes.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: --linux
          - name: Windows
            os: windows-latest
            target: --win
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build app
        run: pnpm --filter @chaturanga/desktop build

      # Linux runners have no display: the app runs under xvfb there.
      - name: Smoke journeys (out/ on Electron from node_modules)
        working-directory: apps/desktop
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a pnpm test:e2e:run
          else
            pnpm test:e2e:run
          fi

      # The same journeys against the unpacked app electron-builder makes (asar, packaged paths).
      - name: Package (unpacked, unsigned)
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.target }} --dir --publish never

      - name: Check packaged app contents
        run: node scripts/check-packaged-app.mjs

      - name: Smoke journeys (packaged app)
        working-directory: apps/desktop
        shell: bash
        env:
          CHATURANGA_E2E_PACKAGED: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a pnpm test:e2e:run
          else
            pnpm test:e2e:run
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ runner.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
