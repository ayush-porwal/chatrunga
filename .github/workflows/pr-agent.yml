name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      ${{
        (github.event.sender.type != 'Bot' && github.event_name == 'pull_request') ||
        (
          github.event.sender.type != 'Bot' &&
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body || '', '/')
        )
      }}
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One review per PR at a time (a push and a /review comment would otherwise both call the
    # model and hit its rate limit). Set on the job, so comments that skip it don't queue here.
    # A new push replaces a review still running; a command waits for the one in progress.
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: write
    steps:
      - name: Review with GLM 5.3
        uses: the-pr-agent/pr-agent@1239ac001a297b185fccc313fcd19e476a848851 # main, 2026-10-02
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAI.KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_BASE: https://api.z.ai/api/coding/paas/v4
          config.model: zai/glm-5.3
          config.fallback_models: '["zai/glm-5.3-flash"]'
          config.custom_model_max_tokens: "1000000"
          # The default 32k cap split a ~77k-token PR into 3 chunks, sent at once: two timed out and
          # their retries hit Z.ai's rate limit. Up to 200k tokens is one call; only larger PRs chunk.
          config.max_model_tokens: "200000"
          # A whole PR at max reasoning took ~6 min (the default timeout is 2).
          config.ai_timeout: "900"
          # A call that times out goes to the fallback model rather than repeating the same wait.
          config.retry_same_model_on_timeout: "false"
          config.reasoning_effort: max
          config.additional_reasoning_effort_models: '["zai/glm-5.3", "zai/glm-5.3-flash"]'
          config.persistent_inline_comments: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_reviewer.persistent_comment: "true"
          pr_reviewer.final_update_message: "false"
          pr_reviewer.inline_key_issues: "true"
          pr_reviewer.num_max_findings: "20"
          pr_reviewer.enable_large_pr_chunking: "true"
          # Chunks are reviewed in parallel; two at once stays under the rate limit.
          pr_reviewer.max_number_of_calls: "2"
          pr_reviewer.extra_instructions: "Only report a finding you are highly confident is a real bug, security issue, or significant performance problem introduced by this diff. Skip the nits pits, speculative concerns, and anything you cannot anchor to a changed line. Do not pad the list to reach the maximum. An empty list is the right result when nothing qualifies."
