name: release

# Manual release: Actions → release → Run workflow.
# Builds the latest commit on main for macOS, Windows and Linux, then publishes a
# GitHub release (tag vX.Y.Z) with generated notes and all installers attached.
#
# Nightly: every night (and on demand, channel "nightly") the same build is published as a
# prerelease vX.Y.Z-nightly.YYYYMMDD, the patch after the latest release. Only nightly builds
# update to nightlies (updater-state.ts); the production app never sees them. A night with no new
# commits on main publishes nothing, and only the newest nightlies are kept (NIGHTLIES_KEPT).
# The Electron smoke journeys don't run here: every pull request runs them against the built and
# the packaged app on Linux, Windows and macOS (e2e.yml) before it can merge. Lint, typecheck and
# tests run beside the builds (not before them) and still gate the publish.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Stable release, or a nightly prerelease of main (its version is set automatically)
        type: choice
        options: [stable, nightly]
        default: stable
      bump:
        description: Stable only. Version bump from the latest release (ignored when "version" is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Stable only (a nightly refuses it). Exact version instead of a bump, e.g. 0.2.0 or 0.3.0-rc.1 (optional)
        type: string
        required: false
      draft:
        description: Create the release as a draft (review before publishing; stable only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.0.9
  # The scheduled run is a nightly; a dispatch is whatever channel it picked.
  CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'stable' }}
  # Nightly prereleases kept on GitHub (older ones and their tags are deleted after a publish).
  NIGHTLIES_KEPT: 7

jobs:
  plan:
    name: Plan version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Checkout main (with tags)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Pin the commit being released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute version and release notes
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-plan.mjs \
            --channel "$CHANNEL" \
            --bump "$BUMP" \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes release-notes.md > plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
          if grep -q '^skip=true$' plan.txt; then
            echo "Nothing new on main since the last tag, or tonight's nightly exists: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  verify:
    name: Lint, typecheck, test
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm test:coverage
      - run: node --test scripts/*.test.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS (arm64 + x64)
            os: macos-15
            target: --mac
          - name: Windows (x64)
            os: windows-latest
            target: --win
          - name: Linux (x64)
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm --filter @chaturanga/desktop build
        env:
          # Optional usage analytics (docs/telemetry.md): the PostHog project's public ingest token
          # and its region's host, from repository variables. Unset: the build can't send anything.
          MAIN_VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          MAIN_VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Marks a nightly build as one (its analytics channel); unset for a release.
          MAIN_VITE_RELEASE_CHANNEL: ${{ env.CHANNEL == 'nightly' && 'nightly' || '' }}

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          # Unsigned builds until signing certificates are added as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec electron-builder ${{ matrix.target }} \
            --publish never \
            -c.extraMetadata.version="${{ needs.plan.outputs.version }}"

      # A package missing main, preload, renderer or a worker would install but not start.
      - name: Check packaged app contents
        run: node scripts/check-packaged-app.mjs

      # latest*.yml, the .blockmap files and the macOS .zip are what in-app updates (electron-updater)
      # read from the release; keep them in the upload.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [plan, verify, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download installers and notes
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -path artifacts/release-notes -prune -o -type f -print0 | xargs -0 -I{} cp {} release/
          cd release
          sha256sum -- * > SHA256SUMS.txt
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          DRAFT: ${{ env.CHANNEL == 'stable' && inputs.draft }}
        run: |
          # Production releases are marked latest: in-app updates follow /releases/latest
          # (prereleases only reach a build that is one, i.e. a nightly). Drafts are invisible to
          # them until published.
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease) || flags+=(--latest)
          [[ "$DRAFT" == "true" ]] && flags+=(--draft)
          {
            cat artifacts/release-notes/release-notes.md
            printf '\n### Install\n\n'
            printf -- '- **macOS:** `.dmg` (Apple silicon: arm64, Intel: x64). Builds are not notarized yet: right-click the app → Open on first launch.\n'
            printf -- '- **Windows:** `-setup.exe` installer (x64). SmartScreen may warn about an unsigned app: More info → Run anyway.\n'
            printf -- '- **Linux:** `.AppImage` (x64): `chmod +x` it and run.\n'
            printf -- '- Verify downloads with `SHA256SUMS.txt`.\n'
          } > notes.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Chaturanga v$VERSION" \
            --notes-file notes.md \
            "${flags[@]}"

      # Only the newest nightlies stay: older nightly prereleases are deleted with their tags.
      # Stable releases and other prereleases (e.g. a hand-made -rc) are never touched.
      - name: Prune old nightlies
        if: env.CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}$"))) | .tagName' \
            | sort -t . -k 4 -n -r \
            | tail -n +$((NIGHTLIES_KEPT + 1)) \
            | while read -r tag; do
                echo "Deleting old nightly $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
